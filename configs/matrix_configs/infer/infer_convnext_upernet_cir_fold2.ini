[CONFIG]
model = convnext_base_upernet
dev_mode = false
#weights from this cell's fold-model; it infers ONLY its own held-out fold
model_to_load = ../logs_and_models/spatial_matrix/convnext_upernet/convnext_upernet_cir_fold2/models/convnext_upernet_cir_fold2.pth

datatypes = ["cir"]
channels = [[0, 1, 2]]
means = [0.485, 0.456, 0.406]
stds = [0.229, 0.224, 0.225]

ignore_index = 0
batch_size = 4
to_fp16 = false
to_bf16 = true
tf32 = false
cudnn_benchmark = true
pin_memory = true
prefetch_factor = 2
num_workers = 4
save_workers = 2

transforms = []
im_type = ".tif"
label_image_type = ".tif"
extra_labels = "None"
show = false
droppable_channels = []
save_probs = false
save_preds = true
saved_probs_format = "uint8"
crop_size = false

use_wandb = true
wandb_project = "thesis spatial matrix"

[DATASET]
benchmark_folder = ../multi_channel_dataset_creation/example_dataset/data/splitted/
path_to_images = ../multi_channel_dataset_creation/example_dataset/data/splitted/rgb
path_to_labels = ../multi_channel_dataset_creation/example_dataset/labels/splitted_labels
path_to_dataset = ../multi_channel_dataset_creation/example_dataset/
#held-out fold tiles only -> predictions land in the iter_5 layout that pooled_oof_metrics reads
path_to_all_benchmarkset_txt = ../logs_and_models/route_class_audit/fold_2_valid.txt
output_folder = ../logs_and_models/spatial_matrix/convnext_upernet/convnext_upernet_cir_fold2/models/example_dataset
path_to_codes = ../multi_channel_dataset_creation/example_dataset/labels/codes.txt
experiment_root = ../logs_and_models/spatial_matrix/convnext_upernet

[NAME]
job_name = "infer_convnext_upernet_cir_fold2"
