[CONFIG]
model = convnext_base_upernet
sceduler = "fit_one_cycle"
loss_function = "cross_entropy"
pretrained = true
dev_mode = false
epochs = 10
ignore_index = 0
last_epoch = false
model_to_load = false
save_on_batch_iter_modulus_n = 10000
freeze = false

#channel block (n_in = len(means)); verbatim from the verified pilot job_dictionaries
datatypes = ["cir", "nDSM"]
channels = [[0, 1, 2], [0]]
means = [0.485, 0.456, 0.406, 0.010076483036168348]
stds = [0.229, 0.224, 0.225, 0.022261953346304587]

#precision: pure bf16 autocast, TF32 OFF (2026-06-27 decision); cudnn_benchmark uniform across all four
to_fp16 = false
to_bf16 = true
tf32 = false
cudnn_benchmark = true
batch_size = 4
pin_memory = true
prefetch_factor = 2
n_acc = 1
num_workers = 4
lr = 0.002
gradient_clip = 0.02
im_type = ".tif"
label_image_type = ".tif"
transforms = ["Transpose", "ShiftScaleRotate", "GaussNoise", "HorizontalFlip", "VerticalFlip"]
droppable_channels = []

#LOCKED weighted cross-entropy (unknown2_neutral :: effnum_px_eps_1e-08); list = enable switch
class_weights = [1.0, 0.03350504084927361, 0.03715017822219386, 0.03834847724846554, 0.033495723390315646, 2.3584697404377573, 6.318921707906307, 0.05673278642265436, 0.04786654705976479, 1.0, 0.07550979846326629]

use_wandb = true
wandb_project = "thesis spatial matrix"

[DATASET]
path_to_images = ../multi_channel_dataset_creation/example_dataset/data/splitted/rgb
path_to_labels = ../multi_channel_dataset_creation/example_dataset/labels/splitted_labels
path_to_dataset = ../multi_channel_dataset_creation/example_dataset/
#full pool; train = all.txt - path_to_valid_txt (the frozen held-out fold)
path_to_all_txt = ../multi_channel_dataset_creation/example_dataset/data/all.txt
path_to_valid_txt = ../logs_and_models/route_class_audit/fold_1_valid.txt
path_to_codes = ../multi_channel_dataset_creation/example_dataset/labels/codes.txt
experiment_root = ../logs_and_models/spatial_matrix/convnext_upernet

[NAME]
job_name = "convnext_upernet_cir_ndsm_fold1"

[loading_extra_labels_froim_building_masks]
extra_labels = "None"
